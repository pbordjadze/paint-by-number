# The feedback relay (worker.js: its header is the manual). Deployed by
# .github/workflows/feedback-relay.yml, which also sets the secret FEEDBACK_GITHUB_TOKEN.
name = "moonlight-feedback"
main = "worker.js"
compatibility_date = "2025-10-01"
# node:buffer, for base64 that is native code (the free plan allows 10 ms of CPU per request).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# The private repository the reports go to.
FEEDBACK_REPO = "pbordjadze/paint-feedback"
# Tonight's Picture's schedule, which says which ballots are open (votes.js).
NIGHTS_URL = "https://raw.githubusercontent.com/pbordjadze/paint-by-number/nights/nights.json"
# One Big Sheet's print service (print.js): Prodigi's v5 API with a sandbox key (sent as
# sandbox_<key>), which prints and charges nothing. The relay refuses a live key or another API:
# live printing waits for payments. Its key is the secret PRODIGI_API_KEY.
PRODIGI_API = "https://api.prodigi.com/v5"
# What the painter pays over Prodigi's cost, shipping included: 0.4 is 40%.
MARKUP = "0.4"

# A flood brake per IP address: a limiter's period is 10 or 60 seconds, so this is 3 a minute, not
# a limit per hour. Counted per Cloudflare location, approximately.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "3141"

  [ratelimits.simple]
  limit = 3
  period = 60

# And one for every sender together (at one Cloudflare location): 10 reports a minute keeps a
# burst under GitHub's limit on writes a minute (about 80; a report makes 7) however many
# addresses send. A burst brake only: worker.js's header says what it doesn't stop.
[[ratelimits]]
name = "RATE_LIMITER_ALL"
namespace_id = "3142"

  [ratelimits.simple]
  limit = 10
  period = 60

# Votes for a coming night's picture (votes.js): 6 a minute an address, a flood brake only, since
# the app keeps one vote a ballot itself.
[[ratelimits]]
name = "VOTE_LIMITER"
namespace_id = "3143"

  [ratelimits.simple]
  limit = 6
  period = 60

# One Big Sheet's quotes and orders (print.js): 10 a minute an address, a flood brake only.
[[ratelimits]]
name = "PRINT_LIMITER"
namespace_id = "3144"

  [ratelimits.simple]
  limit = 10
  period = 60

# Each night's ballot counts in a Durable Object of its own (votes.js, Ballot), on SQLite storage,
# which the free plan offers.
[[durable_objects.bindings]]
name = "BALLOTS"
class_name = "Ballot"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ballot"]

# Each sheet One Big Sheet keeps for the printer, in a Durable Object of its own (print.js,
# PrintSheet), deleted by an alarm two weeks on.
[[durable_objects.bindings]]
name = "PRINT_SHEETS"
class_name = "PrintSheet"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PrintSheet"]

# Once a day, 7:17 AM ET in winter: One Big Sheet's payments in Stripe checked against the orders
# the print service accepted (print.js, reconcilePrints); a payment with no print is an issue.
[triggers]
crons = ["17 12 * * *"]

# Only what the worker logs itself (errors), not every request.
[observability]
enabled = true

  [observability.logs]
  invocation_logs = false
