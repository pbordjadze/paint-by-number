name: TestFlight

# A signed Release build for TestFlight, on request only (CI's IPA job keeps making the unsigned
# SideStore builds). Every run archives, signs and has App Store Connect validate the app; only a
# run from Actions › TestFlight › Run workflow with "Upload" ticked (from `main`) uploads it, and
# then its `testers` job waits for App Store Connect to process the build, puts it in the
# Friends & Family group with its What to Test and submits it for Beta App Review
# (ci/testflight_testers.py): one button from `main` to testers. A push to a
# `claude/testflight-dryrun*` branch runs the dry run on its commit (ci.yml ignores those
# branches).
# Signing is Xcode's cloud signing with an App Store Connect API key: the archive is built
# unsigned, as the IPA job's is, and -exportArchive signs it with the team's cloud-managed
# distribution certificate and an App Store profile it makes, so no certificate or profile lives
# in the secrets. The key needs the Admin role (cloud signing and creating profiles ask for it).
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text), APPLE_TEAM_ID.
# The build is MARKETING_VERSION (<run>.<attempt>): every run, and every re-run of one, uploads a
# build number App Store Connect hasn't seen.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight and give it to Friends & Family (otherwise sign and validate only)'
        type: boolean
        default: false
      what_to_test:
        description: 'What to Test, shown to testers (empty: the standing text)'
        required: false
  push:
    branches: ['claude/testflight-dryrun*']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: App/PaintByNumber.xcodeproj
  SCHEME: PaintByNumber
  ARCHIVE: build/PaintByNumber.xcarchive

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      # The uploaded build, for `testers` (kept when a failed `testers` alone is re-run).
      build: ${{ steps.upload.outputs.build }}
    env:
      BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && 'true' || 'false' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: From main only
        # Upload sends App Store Connect and the testers what this run checked out: only main's
        # reviewed code goes (the header's rule).
        if: github.event_name == 'workflow_dispatch' && inputs.upload && github.ref_name != 'main'
        run: |
          echo "::error::Upload runs from main only, and this run is on $GITHUB_REF_NAME: run it again from main, or without Upload for a dry run"
          exit 1
      - uses: actions/checkout@v5
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings › Secrets and variables › Actions)"; exit 1
            fi
          done
          # Rebuilt from its base64 alone: a key copied on a phone can lose its line breaks or
          # gain spaces, which a PEM reader rejects.
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 isn't a private key: paste the whole .p8 file, BEGIN and END lines included"; exit 1
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" -quiet \
            CURRENT_PROJECT_VERSION="$BUILD" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/archive.log | tail -80
          APP="$ARCHIVE/Products/Applications/PaintByNumber.app"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
          ci/check_release.sh "$APP" 2>&1 | tee out/release-check.log
      - name: Sign
        # Cloud signing happens here, into an IPA that the next steps validate and upload. (Xcode's
        # own upload asks App Store Connect for a store configuration that refuses the team key's
        # JWT; altool accepts the same key.)
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee out/export.log | tail -80
      - name: Validate with App Store Connect
        # The checks an upload gets (signature, Info.plist, icons, entitlements), without uploading.
        run: |
          set -o pipefail
          IPA=$(ls build/export/*.ipa)
          mkdir -p ~/private_keys && cp "$ASC_KEY_PATH" ~/private_keys/
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee out/validate.log | tail -40
          grep -qiE 'No errors validating|successfully' out/validate.log
      - name: Upload
        id: upload
        if: env.UPLOAD == 'true'
        run: |
          set -o pipefail
          xcrun altool --upload-app -f "$(ls build/export/*.ipa)" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee out/upload.log | tail -40
          grep -qiE 'No errors uploading|UPLOAD SUCCEEDED' out/upload.log
          echo "Uploaded build $BUILD: App Store Connect processes it (usually 5 to 30 minutes) before TestFlight offers it."
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: testflight, path: out, if-no-files-found: ignore }

  testers:
    name: Give the build to Friends & Family
    needs: upload
    if: needs.upload.outputs.build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Wait for processing, add to the group, submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ needs.upload.outputs.build }}
          WAIT_MINUTES: '50'
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" ci/testflight_testers.py
