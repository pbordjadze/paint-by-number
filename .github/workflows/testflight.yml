name: TestFlight

# A signed Release build for TestFlight, on request only (CI's IPA job keeps making the unsigned
# SideStore builds). Every run archives, signs and has App Store Connect validate the app; only a
# run from Actions › TestFlight › Run workflow with "Upload" ticked (from `main`) uploads it, and
# then its `testers` job waits for App Store Connect to process the build, gives it its What to
# Test and, with "Friends & Family" ticked, puts it in that group and submits it for Beta App
# Review (ci/testflight_testers.py; the internal group Team gets every build without review):
# one button from `main` to testers. A push to a
# `claude/testflight-dryrun*` branch runs the dry run on its commit (ci.yml ignores those
# branches), and so does a push to `main` that changes what the app bundles (`bundled` lists the
# paths), so that an error only App Store Connect sees, like 90535 (a bundle's Info.plist naming
# an executable), shows the day it lands, not on release night (painting-company row 315). Every
# other push to `main` stops at `bundled`, on Linux, and holds no macOS runner.
# Signing is Xcode's cloud signing with an App Store Connect API key: the archive is built
# unsigned, as the IPA job's is, and -exportArchive signs it with the team's cloud-managed
# distribution certificate and an App Store profile it makes, so no certificate or profile lives
# in the secrets. The key needs the Admin role (cloud signing and creating profiles ask for it).
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text), APPLE_TEAM_ID.
# The build is MARKETING_VERSION (<run>.<attempt>): every run, and every re-run of one, uploads a
# build number App Store Connect hasn't seen.
# The nightly: the SideStore build (`UNRELEASED`, as ci.yml's `ipa` job archives it) uploaded as
# the same app under version 99.0, a train of its own that no release takes, for the internal
# group Team alone: no Beta App Review, never Friends & Family, never submitted (ci/testflight_testers.py
# refuses a 99.0 build to them however it is run). Every night at 08:00 UTC (3 AM ET in winter)
# it uploads `main` if `main` moved since the last nightly; Run workflow with "Nightly" and
# "Upload" ticked does the same on request, and a push to a
# `claude/testflight-dryrun*nightly*` branch is its dry run. Installing it replaces the App Store
# or TestFlight copy on that device, with the same paintings.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight and give it to its testers (otherwise sign and validate only)'
        type: boolean
        default: false
      what_to_test:
        description: 'What to Test, shown to testers (empty: the standing text)'
        required: false
      friends_and_family:
        description: 'Also give it to Friends & Family (submits it for Beta App Review); unticked, only the internal group Team gets it'
        type: boolean
        default: true
      nightly:
        description: 'The nightly: the SideStore build as version 99.0, for Team alone'
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: ['claude/testflight-dryrun*', 'main']

permissions:
  contents: read
  actions: read

env:
  NIGHTLY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly) || (github.event_name == 'push' && contains(github.ref_name, 'nightly'))) && 'true' || 'false' }}
  NIGHTLY_VERSION: '99.0'
  PROJECT: App/PaintByNumber.xcodeproj
  SCHEME: PaintByNumber
  ARCHIVE: build/PaintByNumber.xcarchive

jobs:
  bundled:
    name: Does this push change what the app bundles
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        if: github.ref_name == 'main' && github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # The nightly uploads only when main moved since the last one.
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/testflight.yml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
            echo "last nightly: ${last:-none}"
            echo "run=$([ "$last" != "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF_NAME" != main ] || [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Every commit since the last main push this workflow passed on, so a change pushed
          # with [skip ci] (no workflow runs for it) or one whose dry run failed is checked again;
          # else the push's own commits; else its last commit alone. Strings catalogs aside:
          # nearly every merge changes one, and App Store Connect checks nothing in them.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/testflight.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD 2>/dev/null; then BEFORE=$last; fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
          echo "since $BEFORE"
          changed=$(git diff --name-only "$BEFORE" HEAD -- \
            App/PaintByNumber/Resources App/RavennaResources App/Config \
            App/PaintByNumber.xcodeproj Package.swift ci/xcode.sh ':(glob)App/**/*.metal' \
            .github/workflows/testflight.yml ':!*.xcstrings')
          echo "$changed"
          echo "run=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  upload:
    name: Archive, sign and upload to TestFlight
    needs: bundled
    if: needs.bundled.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    # One upload at a time, and one dry run. An upload never waits in the dry runs' queue, where
    # a newer run would replace it.
    concurrency:
      # The nightly (its dry runs too) has a queue of its own, so it never replaces a release
      # upload waiting here, and main's dry runs never replace it.
      group: testflight-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly) || (github.event_name == 'push' && contains(github.ref_name, 'nightly'))) && 'nightly' || ((github.event_name == 'workflow_dispatch' && inputs.upload) && 'upload' || 'dry-run') }}
      cancel-in-progress: false
    outputs:
      # The uploaded build, for `testers` (kept when a failed `testers` alone is re-run).
      build: ${{ steps.upload.outputs.build }}
    env:
      BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
      UPLOAD: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upload)) && 'true' || 'false' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: From main only
        # Upload sends App Store Connect and the testers what this run checked out: only main's
        # reviewed code goes (the header's rule).
        if: github.event_name == 'workflow_dispatch' && inputs.upload && github.ref_name != 'main'
        run: |
          echo "::error::Upload runs from main only, and this run is on $GITHUB_REF_NAME: run it again from main, or without Upload for a dry run"
          exit 1
      - uses: actions/checkout@v5
      - name: Xcode
        run: ci/xcode.sh
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings › Secrets and variables › Actions)"; exit 1
            fi
          done
          # Rebuilt from its base64 alone: a key copied on a phone can lose its line breaks or
          # gain spaces, which a PEM reader rejects.
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 isn't a private key: paste the whole .p8 file, BEGIN and END lines included"; exit 1
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          # The nightly carries what the release leaves out for now, as the SideStore build does.
          FLAVOR=()
          if [ "$NIGHTLY" = true ]; then
            FLAVOR=(MARKETING_VERSION="$NIGHTLY_VERSION" SWIFT_ACTIVE_COMPILATION_CONDITIONS='UNRELEASED $(inherited)' EXCLUDED_SOURCE_FILE_NAMES=)
          fi
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" -quiet \
            CURRENT_PROJECT_VERSION="$BUILD" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" "${FLAVOR[@]}" \
            2>&1 | tee out/archive.log | tail -80
          APP="$ARCHIVE/Products/Applications/PaintByNumber.app"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
          ci/check_release.sh "$APP" 2>&1 | tee out/release-check.log
      - name: Entitlements
        # The archive is unsigned, and the export signs with what each bundle's own signature
        # asks for: the widgets and the stickers share the app's group (Outside.entitlements), and
        # the app adds Paint Together's SharePlay (AppStore.entitlements). Extensions first.
        run: |
          APP="$ARCHIVE/Products/Applications/PaintByNumber.app"
          for appex in "$APP"/PlugIns/*.appex; do
            codesign --force --sign - --entitlements App/Config/Outside.entitlements "$appex"
          done
          codesign --force --sign - --entitlements App/Config/AppStore.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q com.apple.developer.group-session
      - name: Identifiers
        # The bundle ids and capabilities the profiles are made from (ci/asc_identifiers.py).
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" ci/asc_identifiers.py
      - name: Sign
        # Cloud signing happens here, into an IPA that the next steps validate and upload. (Xcode's
        # own upload asks App Store Connect for a store configuration that refuses the team key's
        # JWT; altool accepts the same key.)
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee out/export.log | tail -80
      - name: Validate with App Store Connect
        # The checks an upload gets (signature, Info.plist, icons, entitlements), without uploading.
        run: |
          set -o pipefail
          IPA=$(ls build/export/*.ipa)
          mkdir -p ~/private_keys && cp "$ASC_KEY_PATH" ~/private_keys/
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee out/validate.log | tail -40
          grep -qiE 'No errors validating|successfully' out/validate.log
      - name: Upload
        id: upload
        if: env.UPLOAD == 'true'
        run: |
          set -o pipefail
          xcrun altool --upload-app -f "$(ls build/export/*.ipa)" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee out/upload.log | tail -40
          grep -qiE 'No errors uploading|UPLOAD SUCCEEDED' out/upload.log
          echo "Uploaded build $BUILD: App Store Connect processes it (usually 5 to 30 minutes) before TestFlight offers it."
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: testflight, path: out, if-no-files-found: ignore }

  testers:
    name: Give the build to its testers
    needs: upload
    if: needs.upload.outputs.build != ''
    # In the uploads' queue, so the next upload waits for this one's testers. The nightly's testers
    # have a queue of their own: Team gets every build anyway, and a next nightly already waiting
    # for a runner in the nightly's queue would otherwise hold them back until it uploads.
    concurrency:
      group: testflight-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly-testers' || 'upload' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Wait for processing, add to the group, submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ needs.upload.outputs.build }}
          WAIT_MINUTES: '50'
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          EXTERNAL: ${{ inputs.friends_and_family && 'true' || 'false' }}
        run: |
          if [ "$NIGHTLY" = true ]; then
            # Team alone, whatever the inputs say.
            export EXTERNAL=false
            if [ -z "$WHAT_TO_TEST" ]; then
              export WHAT_TO_TEST="Tonight's Paint by Moonlight, from main at ${GITHUB_SHA:0:7}, with every feature not yet in the App Store (the build SideStore installs). Give Feedback, in a painting's More menu, marks the spot."
            fi
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" ci/testflight_testers.py
