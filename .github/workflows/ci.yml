name: CI

# Every run publishes a report (STATUS.md, trimmed logs, compiler errors, test results,
# screenshots, the pipeline quality regression under core/regression/, the string catalog
# check under core/strings-check.log) to the ref `refs/ci-shots/<branch>`: outside refs/heads,
# so a clone never downloads reports, and readable with plain git (see ci/fetch.sh).
# Each simulator gets its own VM: two booted simulators on one 3-core runner thrash. The
# simulator boots in the background while the app builds.
# iPad is the primary device (Debug build, screenshots, tests on every push, then a Release
# build checked for the privacy manifest and for Debug-only code that must not ship); iPhone
# (the same, without the Release check) runs on the shipping branch, main, or on request.
# The shipping branch also publishes an unsigned device IPA as a `build-<n>` prerelease and
# a SideStore source listing the latest builds (branch `sidestore`).

on:
  push:
    branches-ignore: ['ci-shots/**', 'sidestore']
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Demo scenarios to screenshot (space separated, optional @timeout-seconds)'
        required: false
      iphone:
        description: 'Also screenshot and test on iPhone'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: App/PaintByNumber.xcodeproj
  SCHEME: PaintByNumber

jobs:
  core:
    name: PaintCore tests and quality regression (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Python
        # Pillow decodes the regression's photos and draws its sheets (from pbn's rasters; no
        # node needed); the string catalog check is plain Python.
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pil > /dev/null
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          swift test 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]' | tee out/core-test.log | tail -60
      - name: Quality regression
        # Also after failed tests: the metrics help explain them.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          swift build -c release --product pbn 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]' | tail -3
          mkdir -p out/regression
          python3 tools/regression.py --self-test
          python3 tools/regression.py --json out/regression/regression.json --sheets out/regression/sheets \
            | tee out/regression/regression.txt
      - name: String catalog
        # The app's sources and Localizable.xcstrings drifting apart only shows on a device, as a
        # string that silently stays English; the macOS jobs have no Xcode extraction to catch it.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          python3 tools/strings_check.py --self-test
          python3 tools/strings_check.py | tee out/strings-check.log
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: core, path: out, if-no-files-found: ignore }

  ipad:
    name: iPad — Debug build, screenshots, tests, Release check, benchmark
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 2 }
      - name: Start simulator
        id: sim
        run: |
          # The first boot on a fresh runner takes minutes; it overlaps the build.
          read -r _ UDID MODEL RUNTIME < <(ci/simulators.sh ipad)
          echo "$MODEL $RUNTIME $UDID"
          mkdir -p out
          nohup xcrun simctl boot "$UDID" > out/boot.log 2>&1 &
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-build.log | tail -120
      - name: Wait for simulator
        id: boot
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > /dev/null
      - name: Screenshots
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/PaintByNumber.app
          [ -d "$APP" ] || exit 0
          ci/screenshots.sh "$APP" out/shots ipad "${{ steps.sim.outputs.udid }}" ${SCENARIOS:-$(cat ci/scenarios.txt)}
      - name: Test
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd \
            -resultBundlePath build/Tests.xcresult -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-test.log | tail -120
      - name: Release build
        # Not `always()`: that runs on cancelled runs too (holding a runner for a superseded
        # commit) and would repeat the compiler errors of a failed Debug build.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Debug-only code is compiled out of Release (`#if DEBUG`): build it, and check the
          # shipped app has the privacy manifest and none of that code.
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/release-build.log | tail -60
          ci/check_release.sh build/release/Build/Products/Release-iphonesimulator/PaintByNumber.app 2>&1 | tee out/release-check.log
      - name: Pipeline benchmark (Apple silicon)
        if: ${{ !cancelled() }}
        run: |
          # Only when PaintCore differs from the shipping branch (on the shipping branch itself:
          # from the previous commit), so a feature branch's later app-only commits keep
          # benchmarking its pipeline changes; app-only work skips the 2-minute benchmark.
          BASE=HEAD~1
          if [[ "$GITHUB_REF_NAME" != main ]] && git fetch -q --depth=1 origin main; then BASE=FETCH_HEAD; fi
          if git rev-parse -q --verify "$BASE" >/dev/null && git diff --quiet "$BASE" -- Sources Package.swift; then
            echo "PaintCore unchanged; benchmark skipped" | tee out/bench.txt; exit 0
          fi
          swift build -c release --product pbn 2>&1 | tail -2
          # The corpus, as in tools/regression.py (SAMPLE_NAMES): the app's curated picture
          # library would make the timings incomparable and the step long.
          S=Tests/Corpus
          .build/release/pbn bench $S/barn.jpg $S/espresso.jpg $S/hibiscus.jpg $S/lighthouse.jpg \
            $S/parrots.jpg $S/regatta.jpg --runs 3 | tee out/bench.txt
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p out/attachments out/crashes
          cp ~/Library/Logs/DiagnosticReports/PaintByNumber* out/crashes/ 2>/dev/null || true
          # The app's log of the test run (seeding, opening paintings, the canvas, feedback, the create flow), should a test lose the app.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 90m --info --style compact \
            --predicate 'subsystem == "com.pbordjadze.paintbynumber" AND category IN {"feedback", "library", "demo", "canvas", "create"}' \
            > out/test-app.log 2>/dev/null || true
          grep -hE "error:|FAIL:" out/app-build.log out/app-test.log out/release-build.log out/release-check.log 2>/dev/null | sort -u > out/errors.txt || true
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult --compact > out/test-summary.json 2>/dev/null || true
            xcrun xcresulttool get test-results tests --path build/Tests.xcresult --compact > out/test-results.json 2>/dev/null || true
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path out/attachments >/dev/null 2>&1 || true
            # Screen recordings are most of a report's bytes and can't be read from one; the PNGs stay.
            find out/attachments \( -name '*.mp4' -o -name '*.mov' \) -delete 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: ipad, path: out, if-no-files-found: ignore }

  iphone:
    name: iPhone — Debug build, screenshots, tests
    # Secondary device: on the shipping branch, or when requested (workflow_dispatch, or
    # `[iphone]` in the pushed commit's message). The iPad job covers the Release build.
    if: >-
      github.ref_name == 'main' || github.event.inputs.iphone == 'true'
      || contains(github.event.head_commit.message, '[iphone]')
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Start simulator
        id: sim
        run: |
          read -r _ UDID MODEL RUNTIME < <(ci/simulators.sh iphone)
          echo "$MODEL $RUNTIME $UDID"
          mkdir -p out
          nohup xcrun simctl boot "$UDID" > out/boot.log 2>&1 &
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-build.log | tail -120
      - name: Wait for simulator
        id: boot
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > /dev/null
      - name: Screenshots
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/PaintByNumber.app
          [ -d "$APP" ] || exit 0
          ci/screenshots.sh "$APP" out/shots iphone "${{ steps.sim.outputs.udid }}" ${SCENARIOS:-$(cat ci/scenarios.txt)}
      - name: Test
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd \
            -resultBundlePath build/Tests.xcresult -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-test.log | tail -120
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p out/attachments out/crashes
          cp ~/Library/Logs/DiagnosticReports/PaintByNumber* out/crashes/ 2>/dev/null || true
          # The app's log of the test run (seeding, opening paintings, the canvas, feedback, the create flow), should a test lose the app.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 90m --info --style compact \
            --predicate 'subsystem == "com.pbordjadze.paintbynumber" AND category IN {"feedback", "library", "demo", "canvas", "create"}' \
            > out/test-app.log 2>/dev/null || true
          grep -hE "error:" out/app-build.log out/app-test.log 2>/dev/null | sort -u > out/errors.txt || true
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult --compact > out/test-summary.json 2>/dev/null || true
            xcrun xcresulttool get test-results tests --path build/Tests.xcresult --compact > out/test-results.json 2>/dev/null || true
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path out/attachments >/dev/null 2>&1 || true
            # Screen recordings are most of a report's bytes and can't be read from one; the PNGs stay.
            find out/attachments \( -name '*.mp4' -o -name '*.mov' \) -delete 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: iphone, path: out, if-no-files-found: ignore }

  ipa:
    name: IPA for SideStore (unsigned device build)
    if: github.ref_name == 'main'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          # Version 1.0.<run>, build <run>: every build is an update to the installed one.
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PaintByNumber.xcarchive -quiet \
            MARKETING_VERSION="1.0.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/ipa-build.log | tail -80
      - name: Package
        run: |
          # SideStore signs the app with the user's Apple ID when installing it.
          APP=build/PaintByNumber.xcarchive/Products/Applications/PaintByNumber.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../../out/PaintByNumber.ipa Payload)
          ls -l out/PaintByNumber.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
      - name: Publish release and SideStore source
        run: |
          git log -1 --format=%s > out/notes.txt
          gh release create "build-$BUILD" out/PaintByNumber.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Build $BUILD" --notes-file out/notes.txt
          # Keep the five newest builds (KEEP in ci/sidestore_source.py: the same number).
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore"
          mkdir -p build/source
          python3 ci/sidestore_source.py build/PaintByNumber.xcarchive/Products/Applications/PaintByNumber.app \
            "$SOURCE/icon.png" > build/source/source.json
          cp App/PaintByNumber/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png build/source/icon.png
          printf '# SideStore source\n\nAdd %s/source.json in SideStore (Sources → +).\n' "$SOURCE" > build/source/README.md
          cp build/source/source.json out/
          cd build/source
          git init -q && git checkout -q -b sidestore && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "SideStore source for build $BUILD"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "sidestore:refs/heads/sidestore"
      - name: Tell pbordjadze/sidestore
        # The combined source there re-reads this one on a 15-minute schedule GitHub runs late
        # or drops; this rebuilds it now. Needs SIDESTORE_DISPATCH_TOKEN (fine-grained,
        # Contents: read and write on that repo; issue #1).
        env:
          DISPATCH_TOKEN: ${{ secrets.SIDESTORE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "No SIDESTORE_DISPATCH_TOKEN: the combined source catches up on its schedule"; exit 0; fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/pbordjadze/sidestore/dispatches -f event_type="paint-by-number build $BUILD" \
            || echo "::warning::Couldn't notify pbordjadze/sidestore; its schedule will pick the build up"
      - uses: actions/upload-artifact@v5
        if: always()
        # The IPA is the build-<n> release asset; the report doesn't carry it.
        with:
          name: ipa
          path: |
            out
            !out/*.ipa
          if-no-files-found: ignore

  report:
    name: Publish report
    needs: [core, ipad, iphone, ipa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: report }
      - name: Write status and push to refs/ci-shots/${{ github.ref_name }}
        run: |
          mkdir -p report && cd report
          for f in $(find . -name '*.log'); do
            # Keep every diagnostic line plus the tail; full logs can be huge.
            { grep -nE "error:|warning:|failed|FAIL|✘|Fatal|crash" "$f" | head -400; echo "----- tail -----"; tail -200 "$f"; } > "$f.trimmed"
            mv "$f.trimmed" "$f"
          done
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "core: ${{ needs.core.result }}"
            if [ -f core/regression/regression.txt ]; then echo "regression: $(tail -n 1 core/regression/regression.txt)"; fi
            if [ -f core/strings-check.log ]; then echo "strings: $(tail -n 1 core/strings-check.log)"; fi
            echo "ipad: ${{ needs.ipad.result }}"
            echo "iphone: ${{ needs.iphone.result }}"
            echo "ipa: ${{ needs.ipa.result }}"
          } > STATUS.md
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b shots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/ci-shots/${GITHUB_REF_NAME}"
