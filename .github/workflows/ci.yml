name: CI

# Every run publishes a report (STATUS.md, trimmed logs, compiler errors, test results,
# screenshots, the pipeline quality regression under core/regression/, the string catalog
# check under core/strings-check.log) to the ref `refs/ci-shots/<branch>`: outside refs/heads,
# so a clone never downloads reports, and readable with plain git (see ci/fetch.sh).
# The simulator work is one matrix (`apple`), each entry on a VM of its own (two booted
# simulators on one 3-core runner thrash), its simulator booting while the app builds:
#   ipad     Debug build, screenshots, unit tests and the Settings UI tests, then a Release
#            build checked for the privacy manifest and for Debug-only code that must not ship,
#            and the pipeline benchmark
#   ipad-ui  Debug build, the other UI tests
#   iphone   Debug build, screenshots, unit and UI tests: on the shipping branch, main, or on
#            request (workflow_dispatch's `iphone`, or `[iphone]` in the pushed commit's message)
#   compile  `[compile]` in a branch's pushed commit's message (never main's), instead of the three above: the Debug
#            build (app and both test targets), the Release build and its check, the SideStore
#            build (as the IPA job's, for the simulator) and the warnings gate, on one runner and
#            with no simulator; `core` only builds and checks the strings.
#            A branch's quick check before it takes a full slot.
# iPad is the primary device, its work split in two so a push waits for about half of it. The
# shipping branch also publishes an unsigned device IPA as a `build-<n>` prerelease and a
# SideStore source listing the latest builds (branch `sidestore`).

on:
  push:
    branches-ignore: ['ci-shots/**', 'sidestore', 'claude/testflight-dryrun*', 'claude/testflight-testers*', 'claude/store-screenshots*', 'claude/store-listing*']
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Demo scenarios to screenshot (space separated, optional @timeout-seconds)'
        required: false
      iphone:
        description: 'Also screenshot and test on iPhone'
        type: boolean
        default: false

# Read only, but for the two jobs that publish (the IPA's release and the SideStore source; the
# report's ref): the others build and run code that has no need to push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPILE: ${{ (github.ref_name != 'main' && contains(github.event.head_commit.message, '[compile]')) && '1' || '0' }}
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: App/PaintByNumber.xcodeproj
  SCHEME: PaintByNumber
  APP: build/dd/Build/Products/Debug-iphonesimulator/PaintByNumber.app

jobs:
  core:
    name: PaintCore tests and quality regression (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Install Python
        # Pillow decodes the regression's photos and draws its sheets (from pbn's rasters; no
        # node needed); the string catalog check is plain Python; numpy is for the making-of
        # tools' tests (the show's Python reference).
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pil python3-numpy > /dev/null
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          if [[ "$COMPILE" == 1 ]]; then BUILD=(build --build-tests); else BUILD=(test); fi
          swift "${BUILD[@]}" 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]' | tee out/core-test.log | tail -60
      - name: Compiler warnings
        # A new warning fails the job (main has none); the test build compiles every target.
        if: ${{ !cancelled() }}
        shell: bash
        run: ci/warnings.sh out/warnings.txt out/core-test.log
      - name: Feedback relay tests
        # The Worker behind Give Feedback (feedback-relay/) against a mocked GitHub; Ubuntu's node 18.
        if: ${{ !cancelled() && env.COMPILE != '1' }}
        shell: bash
        run: |
          apt-get install -y -qq --no-install-recommends nodejs > /dev/null
          node --test feedback-relay/worker.test.js
      - name: Quality regression
        # Also after failed tests: the metrics help explain them.
        if: ${{ !cancelled() && env.COMPILE != '1' }}
        shell: bash
        run: |
          set -o pipefail
          swift build -c release --product pbn 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]' | tail -3
          mkdir -p out/regression
          python3 tools/regression.py --self-test
          python3 tools/regression.py --json out/regression/regression.json --sheets out/regression/sheets \
            | tee out/regression/regression.txt
      - name: Making-of show (Python reference)
        # Sources/MakingOf's tests replay the fixtures these write; this fails when a fixture is not
        # what the Python makes now, or the Python's own cases break (no node or ffmpeg needed).
        if: ${{ !cancelled() && env.COMPILE != '1' }}
        shell: bash
        run: python3 -m unittest discover -s tools/tests -p 'test_making_of_*.py'
      - name: String catalog
        # The app's sources and Localizable.xcstrings drifting apart only shows on a device, as a
        # string that silently stays English; the macOS jobs have no Xcode extraction to catch it.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          python3 tools/strings_check.py --self-test
          python3 tools/strings_check.py | tee out/strings-check.log
      - name: CI report script
        # The report job runs ci/report.py once, at the end: a break there costs every waiter the run.
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 ci/report.py --self-test
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: core, path: out, if-no-files-found: ignore }

  apple:
    name: ${{ matrix.job == 'ipad' && 'iPad — build, screenshots, unit tests, Release check' || matrix.job == 'ipad-ui' && 'iPad — UI tests' || matrix.job == 'compile' && 'iPad — compile check' || 'iPhone — build, screenshots, tests' }}
    runs-on: macos-26
    # iPhone's screenshots and tests take about 80 minutes when a pipeline change empties the
    # demo caches; 75 cut its tests off, and 100 did on a slow runner (main, October 18: its
    # last green run took 85), and 130 did too (main's run 559, October 22: its tests had passed,
    # 76 minutes on a runner some 15% slower than run 557's, whose job took 110).
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        # compile and iphone as the header says; the report job asks the same.
        job: ${{ fromJSON((github.ref_name != 'main' && contains(github.event.head_commit.message, '[compile]')) && '["compile"]' || (github.ref_name == 'main' || github.event.inputs.iphone == 'true' || contains(github.event.head_commit.message, '[iphone]')) && '["ipad", "ipad-ui", "iphone"]' || '["ipad", "ipad-ui"]') }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Plan
        # The entry's device and share of the work. ONLY and SKIP list the tests it runs or leaves
        # out (`-only-testing`, `-skip-testing`; neither: all). The Settings and play mailbox UI
        # tests run beside the unit tests, so that `ipad` and `ipad-ui` take about as long.
        run: |
          case "${{ matrix.job }}" in
            ipad)    plan=(DEVICE=ipad SHOTS=1 RELEASE=1 "ONLY=PaintByNumberTests PaintByNumberUITests/SettingsTests PaintByNumberUITests/PlayTests" SKIP=) ;;
            ipad-ui) plan=(DEVICE=ipad SHOTS=0 RELEASE=0 ONLY=PaintByNumberUITests "SKIP=PaintByNumberUITests/SettingsTests PaintByNumberUITests/PlayTests") ;;
            iphone)  plan=(DEVICE=iphone SHOTS=1 RELEASE=0 ONLY= SKIP=) ;;
            compile) plan=(DEVICE=ipad SHOTS=0 RELEASE=1 ONLY= SKIP=) ;;
          esac
          printf '%s\n' "${plan[@]}" >> "$GITHUB_ENV"
      - name: Start simulator
        id: sim
        if: env.COMPILE != '1'
        run: |
          # The first boot on a fresh runner takes minutes; it overlaps the build.
          read -r _ UDID MODEL RUNTIME < <(ci/simulators.sh "$DEVICE")
          echo "$MODEL $RUNTIME $UDID"
          mkdir -p out
          nohup xcrun simctl boot "$UDID" > out/boot.log 2>&1 &
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        id: build
        run: |
          # arm64 only: a generic destination builds every simulator architecture, and the
          # runners are Apple silicon. No index store: nothing here reads it.
          set -o pipefail
          mkdir -p out
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-build.log | tail -120
      - name: Wait for simulator
        id: boot
        if: env.COMPILE != '1'
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b > /dev/null
          # A UI test's `XCUIDevice.shared.appearance` changes nothing on a simulator whose
          # appearance was never set (DarkPaperTests, with no screenshots before it).
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance dark || true
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light || true
      - name: Demo caches key
        id: demo-key
        if: env.COMPILE != '1'
        # Everything that makes the line-art maps and templates the demos and tests seed
        # (ci/demo_caches.sh): a change to any of it starts from empty caches.
        env:
          INPUTS: ${{ hashFiles('Sources/PaintCore/**', 'App/PaintByNumber/Generation/**', 'App/PaintByNumber/Model/ArtworkFactory.swift', 'App/PaintByNumber/Model/DemoTemplateCache.swift', 'App/PaintByNumber/Model/Library.swift', 'App/PaintByNumber/Model/Sample.swift', 'App/PaintByNumber/Features/Create/CreateModel.swift', 'App/PaintByNumber/Resources/Samples/**', 'App/PaintByNumber/Resources/Models/**') }}
        run: |
          echo "key=demo-caches-${{ matrix.job }}-${{ steps.sim.outputs.runtime }}-$INPUTS" >> "$GITHUB_OUTPUT"
      - name: Restore demo caches
        id: demo-cache
        if: env.COMPILE != '1'
        uses: actions/cache/restore@v5
        with:
          path: build/demo-caches
          key: ${{ steps.demo-key.outputs.key }}
      - name: Seed demo caches
        if: steps.demo-cache.outputs.cache-hit == 'true'
        # Caches only save time: a run without them makes what it needs.
        continue-on-error: true
        run: ci/demo_caches.sh in "${{ steps.sim.outputs.udid }}" "$APP" build/demo-caches
      - name: Screenshots
        id: shots
        if: env.SHOTS == '1'
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          # One argument per scenario.
          # shellcheck disable=SC2086
          ci/screenshots.sh "$APP" out/shots "$DEVICE" "${{ steps.sim.outputs.udid }}" ${SCENARIOS:-$(cat ci/scenarios.txt)}
      - name: Warm up demo caches
        id: warmup
        # Without screenshots before them, the UI tests would make the fixed pictures' templates
        # and the previews' maps inside their own waits: on empty caches these scenarios do.
        if: env.SHOTS == '0' && env.COMPILE != '1' && steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          ci/screenshots.sh "$APP" build/warm-up "$DEVICE" "${{ steps.sim.outputs.udid }}" \
            gallery@300 gallery-favorites@300 create-preview@180 create-from-file@180
          cp build/warm-up/*-steps.log out/warm-up-steps.log
      - name: Test
        id: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.boot.outcome == 'success' }}
        run: |
          # A failed test runs once more and counts as passed if that run passes; the report
          # names it ("passed when run again"), as a flake still needs its cause found.
          set -o pipefail
          SELECT=()
          for test in $ONLY; do SELECT+=("-only-testing:$test"); done
          for test in $SKIP; do SELECT+=("-skip-testing:$test"); done
          xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd "${SELECT[@]}" \
            -retry-tests-on-failure -test-iterations 2 -resultBundlePath build/Tests.xcresult -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-test.log | tail -120
      - name: Release build
        id: release
        # Not `always()`: that runs on cancelled runs too (holding a runner for a superseded
        # commit) and would repeat the compiler errors of a failed Debug build.
        if: ${{ !cancelled() && env.RELEASE == '1' && steps.build.outcome == 'success' }}
        run: |
          # Debug-only code is compiled out of Release (`#if DEBUG`): build it, and check the
          # shipped app has the privacy manifest and none of that code.
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/release-build.log | tail -60
          ci/check_release.sh build/release/Build/Products/Release-iphonesimulator/PaintByNumber.app 2>&1 | tee out/release-check.log
      - name: SideStore build
        id: sidestore
        # Paul's SideStore build is Release with UNRELEASED and its files back in, which only main's
        # IPA job makes: the compile check builds it too, so a branch can't break it unseen.
        if: ${{ !cancelled() && env.COMPILE == '1' && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sidestore -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='UNRELEASED $(inherited)' EXCLUDED_SOURCE_FILE_NAMES= \
            2>&1 | tee out/sidestore-build.log | tail -60
      - name: Compiler warnings
        id: warnings
        # A new warning in the app, its tests or PaintCore fails the job (main has none).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ci/warnings.sh out/warnings.txt out/app-build.log out/release-build.log out/sidestore-build.log
      - name: Nickname v2 platform contract (macOS)
        id: nickname
        if: ${{ !cancelled() && matrix.job == 'ipad' }}
        run: |
          set -o pipefail
          swift test --filter ColorNicknameV2Tests 2>&1 | tee out/nickname-v2-test.log | tail -60
      - name: Pipeline benchmark (Apple silicon)
        id: bench
        if: ${{ !cancelled() && env.RELEASE == '1' && env.COMPILE != '1' }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Only when PaintCore differs from the shipping branch (on the shipping branch itself:
          # from where the push found it, as a night train lands several merges at once), so a
          # feature branch's later app-only commits keep benchmarking its pipeline changes;
          # app-only work skips the 2-minute benchmark. No base to compare with: it runs.
          BASE=
          if [[ "$GITHUB_REF_NAME" != main ]]; then
            git fetch -q --depth=1 origin main && BASE=FETCH_HEAD
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch -q --depth=1 origin "$BEFORE" && BASE=FETCH_HEAD
          fi
          if [[ -n "$BASE" ]] && git diff --quiet "$BASE" -- Sources Package.swift; then
            echo "PaintCore unchanged; benchmark skipped" | tee out/bench.txt; exit 0
          fi
          swift build -c release --product pbn 2>&1 | tail -2
          # The corpus, as in tools/regression.py (SAMPLE_NAMES): the app's curated picture
          # library would make the timings incomparable and the step long.
          S=Tests/Corpus
          .build/release/pbn bench $S/barn.jpg $S/espresso.jpg $S/hibiscus.jpg $S/lighthouse.jpg \
            $S/parrots.jpg $S/regatta.jpg --runs 3 | tee out/bench.txt
      - name: Keep demo caches
        id: demo-out
        # After a full, passing run only: caches a run left half made would be kept as made.
        continue-on-error: true
        if: >-
          ${{ !cancelled() && steps.demo-cache.outputs.cache-hit != 'true' && steps.test.outcome == 'success'
          && steps.shots.outcome != 'failure' && steps.warmup.outcome != 'failure' }}
        run: |
          ci/demo_caches.sh out "${{ steps.sim.outputs.udid }}" "$APP" build/demo-caches
          [[ -n "$(ls -A build/demo-caches)" ]]
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && steps.demo-out.outcome == 'success' }}
        continue-on-error: true
        with:
          path: build/demo-caches
          key: ${{ steps.demo-key.outputs.key }}
      - name: Collect diagnostics
        if: always()
        env:
          OUTCOMES: >-
            simulator=${{ steps.sim.outcome }} build=${{ steps.build.outcome }} boot=${{ steps.boot.outcome }}
            screenshots=${{ steps.shots.outcome }} warm-up=${{ steps.warmup.outcome }} tests=${{ steps.test.outcome }}
            release=${{ steps.release.outcome }} sidestore=${{ steps.sidestore.outcome }} warnings=${{ steps.warnings.outcome }}
            nickname-v2=${{ steps.nickname.outcome }}
            benchmark=${{ steps.bench.outcome }}
        run: |
          mkdir -p out
          echo "$OUTCOMES" > out/outcomes.txt
          ci/collect.sh "${{ steps.sim.outputs.udid }}"
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: "${{ matrix.job }}", path: out, if-no-files-found: ignore }

  ipa:
    name: IPA for SideStore (unsigned device build)
    # On a branch, `[ipa]` in the commit's message archives without publishing.
    if: github.ref_name == 'main' || contains(github.event.head_commit.message, '[ipa]')
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          # Version 1.0.<run>, build <run>: every build is an update to the installed one.
          # SideStore builds carry what the release leaves out for now (UNRELEASED, CLAUDE.md ›
          # App rules): its code compiled in and the Release exclusion of its files cleared.
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PaintByNumber.xcarchive -quiet \
            MARKETING_VERSION="1.0.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='UNRELEASED $(inherited)' EXCLUDED_SOURCE_FILE_NAMES= \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/ipa-build.log | tail -80
      - name: Package
        run: |
          # SideStore signs the app with the user's Apple ID when installing it.
          APP=build/PaintByNumber.xcarchive/Products/Applications/PaintByNumber.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../../out/PaintByNumber.ipa Payload)
          ls -l out/PaintByNumber.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
      - name: Publish release and SideStore source
        if: github.ref_name == 'main'
        run: |
          git log -1 --format=%s > out/notes.txt
          gh release create "build-$BUILD" out/PaintByNumber.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Build $BUILD" --notes-file out/notes.txt
          # Keep the five newest builds (KEEP in ci/sidestore_source.py: the same number).
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore"
          mkdir -p build/source
          python3 ci/sidestore_source.py build/PaintByNumber.xcarchive/Products/Applications/PaintByNumber.app \
            "$SOURCE/icon.png" > build/source/source.json
          cp App/PaintByNumber/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png build/source/icon.png
          printf '# SideStore source\n\nAdd %s/source.json in SideStore (Sources → +).\n' "$SOURCE" > build/source/README.md
          cp build/source/source.json out/
          cd build/source
          git init -q && git checkout -q -b sidestore && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "SideStore source for build $BUILD"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "sidestore:refs/heads/sidestore"
      - name: Tell pbordjadze/sidestore
        if: github.ref_name == 'main'
        # The combined source there re-reads this one on a 15-minute schedule GitHub runs late
        # or drops; this rebuilds it now. Needs SIDESTORE_DISPATCH_TOKEN (fine-grained,
        # Contents: read and write on that repo; issue #1).
        env:
          DISPATCH_TOKEN: ${{ secrets.SIDESTORE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "No SIDESTORE_DISPATCH_TOKEN: the combined source catches up on its schedule"; exit 0; fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/pbordjadze/sidestore/dispatches -f event_type="paint-by-number build $BUILD" \
            || echo "::warning::Couldn't notify pbordjadze/sidestore; its schedule will pick the build up"
      - uses: actions/upload-artifact@v5
        if: always()
        # The IPA is the build-<n> release asset; the report doesn't carry it.
        with:
          name: ipa
          path: |
            out
            !out/*.ipa
          if-no-files-found: ignore

  report:
    name: Publish report
    needs: [core, apple, ipa]
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: src, sparse-checkout: ci }
      - uses: actions/download-artifact@v5
        with: { path: report }
      - name: Write status and push to refs/ci-shots/${{ github.ref_name }}
        env:
          # The matrix's entries share its result; iphone only when the matrix ran it.
          IPHONE: ${{ (github.ref_name == 'main' || github.event.inputs.iphone == 'true' || contains(github.event.head_commit.message, '[iphone]')) && needs.apple.result || 'skipped' }}
        run: |
          mkdir -p report && cd report
          find . -name '*.log' | while read -r f; do
            # Long logs keep every diagnostic line, the app's own lines and the tail; the rest stay whole.
            if [ "$(wc -l < "$f")" -gt 3000 ]; then
              { grep -nE "error:|warning:|failed|FAIL|✘|Fatal|crash" "$f" | head -400
                echo "----- the app's own lines -----"; grep -n "com.pbordjadze.paintbynumber:" "$f" | head -2000
                echo "----- tail -----"; tail -200 "$f"; } > "$f.trimmed"
              mv "$f.trimmed" "$f"
            fi
          done
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ "$COMPILE" == 1 ]]; then
              JOBS=(compile=${{ needs.apple.result }})
            else
              JOBS=(ipad=${{ needs.apple.result }} ipad-ui=${{ needs.apple.result }} iphone="$IPHONE")
            fi
            # Should the script break, the jobs' results still reach the ref (and its waiters).
            python3 ../src/ci/report.py . core=${{ needs.core.result }} "${JOBS[@]}" ipa=${{ needs.ipa.result }} \
              || printf '%s\n' "core: ${{ needs.core.result }}" "${JOBS[@]/=/: }" "ipa: ${{ needs.ipa.result }}" \
                "" "ci/report.py failed: no details (its error is in this job's log)"
          } > STATUS.md
          cat STATUS.md
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b shots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/ci-shots/${GITHUB_REF_NAME}"
