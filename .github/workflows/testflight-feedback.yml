name: TestFlight feedback

# Copies what testers sent from the TestFlight app (screenshots with a comment, crashes) from App
# Store Connect into the private feedback repository's `reports/` on `main`, beside the relay's
# (ci/testflight_feedback.py, its docstring the manual). Every hour, and on request: Actions ›
# TestFlight feedback › Run workflow, or a push to a `claude/testflight-feedback*` branch (which ci.yml ignores). Nothing
# testers wrote reaches this public repository's logs: only counts.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back'
        required: false
        default: '14'
  push:
    branches: ['claude/testflight-feedback*']
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: testflight-feedback

permissions:
  contents: read

jobs:
  feedback:
    name: Fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: pbordjadze/paint-feedback
          ref: main
          token: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          path: feedback
      - name: Python
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
      - name: Fetch
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: '"$RUNNER_TEMP/venv/bin/python" ci/testflight_feedback.py feedback/reports --days "${{ inputs.days || 14 }}"'
      - name: Commit
        working-directory: feedback
        run: |
          git add reports
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git -c user.name="TestFlight feedback" -c user.email="actions@users.noreply.github.com" \
            commit --quiet -m "TestFlight feedback $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push --quiet origin HEAD:main
