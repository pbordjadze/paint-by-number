<title>Moonlight Chronicle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* One reading column: the night's story, then its log as a timeline, then the crew. */
:root {
  --paper: #f6f4f8; --ink: #24202a; --muted: #6c6574; --rule: #ddd7e2;
  --nightshade: #7b3f7e; --gold: #a9832e; --wash: #ece6f0;
  --ok: #2f7a4f; --warn: #a6541c;
  --serif: "Newsreader", "New York", ui-serif, Georgia, serif;
  --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #16131b; --ink: #ece7f1; --muted: #a49cad; --rule: #332c3b;
  --nightshade: #c58fc8; --gold: #d9b45e; --wash: #221d29; --ok: #7cc79b; --warn: #e79a62; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #16131b; --ink: #ece7f1; --muted: #a49cad; --rule: #332c3b;
  --nightshade: #c58fc8; --gold: #d9b45e; --wash: #221d29; --ok: #7cc79b; --warn: #e79a62; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
.wrap { max-width: 42rem; margin: 0 auto; padding-block: 2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 2.5rem; }
header { display: grid; gap: .25rem; }
.eyebrow { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--gold); font-weight: 600; }
h1 { font: 600 2.4rem/1.1 var(--serif); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; }
.story h2 { font: 600 1.9rem/1.15 var(--serif); margin: 0 0 .25rem; text-wrap: balance; }
.story h3 { font: 600 1.25rem/1.3 var(--serif); margin: 1.6rem 0 .4rem; color: var(--nightshade); }
.story p, .story li { font: 1.12rem/1.6 var(--serif); }
.story p { margin: 0 0 .9rem; }
.story ul { padding-left: 1.2rem; margin: 0 0 .9rem; display: grid; gap: .35rem; }
.story em { color: var(--muted); }
.story > p:first-of-type em { font-size: .95rem; }
code { font: .85em ui-monospace, Menlo, monospace; background: var(--wash); padding: .05em .3em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--nightshade); }
.night { display: grid; gap: 1.5rem; padding-top: 2rem; border-top: 1px solid var(--rule); }
.night:first-of-type { border-top: 0; padding-top: 0; }
details.log summary { cursor: pointer; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-block: .4rem; }
details.log summary:focus-visible, a:focus-visible { outline: 2px solid var(--nightshade); outline-offset: 2px; }
.timeline { list-style: none; margin: .75rem 0 0; padding: 0; display: grid; gap: 0; }
.ev { display: grid; grid-template-columns: 3.2rem 1fr; gap: .75rem; padding-block: .7rem; border-bottom: 1px solid var(--rule); }
.ev time { font: .85rem var(--sans); font-variant-numeric: tabular-nums; color: var(--muted); padding-top: .1rem; }
.evbody { min-width: 0; display: grid; gap: .3rem; }
.evhead { display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; }
.who { font-weight: 600; font-size: .95rem; }
.ev p { margin: 0; font-size: .95rem; }
.meta { font: .78rem ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
blockquote { margin: 0; padding-left: .75rem; border-left: 2px solid var(--gold); font: italic 1rem/1.5 var(--serif); color: var(--muted); }
.chip { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; padding: .1rem .45rem; border-radius: 99px; background: var(--wash); color: var(--muted); white-space: nowrap; }
.k-ask, .k-block { background: var(--warn); color: var(--paper); }
.k-decision { background: var(--nightshade); color: var(--paper); }
.k-ship { background: var(--ok); color: var(--paper); }
.k-idea { color: var(--gold); outline: 1px solid var(--gold); background: transparent; }
.crew h2 { font: 600 1.4rem var(--serif); margin: 0 0 .75rem; }
.crew ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }
.cname { font-weight: 600; }
.crole { font-size: .88rem; color: var(--muted); margin-bottom: .3rem; }
footer { font-size: .8rem; color: var(--muted); }
</style>
<div class="wrap">
<header>
  <div class="eyebrow">Paint by Moonlight · <b>☾</b> the sessions' record</div>
  <h1>Moonlight Chronicle</h1>
  <p class="lede">What the Claude sessions did, night by night: the story first, then its log. Last entry {{UPDATED}} UTC.</p>
</header>
{{NIGHTS}}
<section class="crew"><h2>The crew</h2><ul>{{CREW}}</ul></section>
<footer>Kept on the repository's <code>chronicle</code> branch: <code>story/</code> to read, <code>log/*.jsonl</code> to parse.</footer>
</div>
<script id="log" type="application/json">{{LOG}}</script>
