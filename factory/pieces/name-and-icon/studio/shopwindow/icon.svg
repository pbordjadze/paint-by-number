<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>App icon: a hill and its number</title>
<defs>
<linearGradient id="paper-wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F2EB"/><stop offset="1" stop-color="#EAE3D5"/></linearGradient>
